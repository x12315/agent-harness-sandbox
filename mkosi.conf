[Distribution]
Distribution=arch

[Build]
# mkosi 装 Arch 包需要外网；postinst 只导入 prepared npm prefix。
# 构建期需要外网（pacman 本来也要），运行期不需要 —— 运行时是物理 airgap。
WithNetwork=yes

[Output]
Format=disk
ImageId=ahsb
# 输出目录不写在这里：它必须落在同步树之外（bin/sync.sh 是整目录替换，
# 产物放里面会被下一次同步抹掉）。由 bin/build-image.sh 用 --output-dir 指定。
# 直接内核启动：vmspawn 用 --linux 指 mkosi 产出的 vmlinuz、--initrd 指从 root 分区
# dump 出来的 initramfs，root 指这块盘。这样不需要 vfat（本机没有 mkfs.vfat），
# 也不需要 virtiofsd（--directory= 那条路在本机起不来）。
ElTorito=no
SplitArtifacts=yes

[Content]
# Bootable 属于 [Content]（放 [Output] 会被 mkosi 警告）。
Bootable=no
Packages=
    systemd
    bash
    iproute2
    socat
    tar
    gzip
    util-linux
    kmod
    linux
    mkinitcpio
    nodejs
    npm
    tmux
    jq
    git
    curl
    ca-certificates
    chromium
    xorg-server-xvfb
    xorg-xwininfo
    xterm
    ttf-dejavu
