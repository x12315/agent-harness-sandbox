# 串口上免密登入 root。
#
# 这不是图方便：带外抢救的定义就是"guest 里的东西把系统搞死了，我仍然要能进去"。
# 任何依赖 guest 内网络/服务/认证的方式，都会在系统半死时一起失效；
# 串口是唯一不依赖 guest 自身状态的通道。
#
# 注意：vmspawn 给 guest 的串口是 hvc0（virtio-console），不是 ttyS0，
# 所以两个名字都要覆盖 —— ttyS0 是"万一以后走真串口"的保险。
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear %I $TERM
